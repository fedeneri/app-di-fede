<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radio Sveglia">
<title>Radio Sveglia · RAI 3</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #1e1e2e;
    --accent: #c8a96e;
    --accent-dim: #8a7248;
    --text: #e8e4dc;
    --text-dim: #6b6860;
    --red: #e05a4e;
    --green: #6abf8a;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    padding: 0 0 env(safe-area-inset-bottom);
  }

  /* Ambient background */
  body::before {
    content: '';
    position: fixed;
    top: -30%;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(ellipse, rgba(200,169,110,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    width: 100%;
    max-width: 420px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 0 20px 32px;
    position: relative;
    z-index: 1;
  }

  /* CLOCK */
  .clock-section {
    text-align: center;
    padding: 48px 0 24px;
  }

  .time-display {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(72px, 22vw, 96px);
    letter-spacing: -2px;
    color: var(--text);
    line-height: 1;
    position: relative;
  }

  .time-display .seconds {
    font-size: 0.35em;
    color: var(--accent);
    vertical-align: super;
    margin-left: 4px;
    font-family: 'DM Mono', monospace;
    font-weight: 300;
  }

  .date-display {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 8px;
  }

  /* RADIO PLAYER */
  .player-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin: 8px 0 24px;
  }

  .station-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .station-name {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .station-sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 20px;
  }

  .player-controls {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .play-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 1.5px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    position: relative;
  }

  .play-btn:active { transform: scale(0.93); }
  .play-btn.playing {
    background: var(--accent);
    color: var(--bg);
  }

  .play-btn.loading::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .volume-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .volume-label {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .volume-slider {
    -webkit-appearance: none;
    width: 100%;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    display: inline-block;
    margin-right: 8px;
  }

  .status-dot.on {
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .status-text {
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    margin-top: 12px;
  }

  /* ALARMS SECTION */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .section-title {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .add-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--accent);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    transition: all 0.15s;
  }

  .add-btn:active { transform: scale(0.9); }

  .alarms-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .alarm-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: border-color 0.2s;
    position: relative;
    overflow: hidden;
  }

  .alarm-card.active {
    border-color: var(--accent-dim);
  }

  .alarm-card.ringing {
    border-color: var(--accent);
    animation: ring-pulse 0.5s ease-in-out infinite alternate;
  }

  @keyframes ring-pulse {
    from { background: var(--surface); }
    to { background: rgba(200,169,110,0.08); }
  }

  .alarm-time-big {
    font-family: 'DM Serif Display', serif;
    font-size: 36px;
    color: var(--text);
    line-height: 1;
    min-width: 90px;
  }

  .alarm-card.active .alarm-time-big { color: var(--accent); }

  .alarm-info {
    flex: 1;
  }

  .alarm-days {
    display: flex;
    gap: 4px;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }

  .day-chip {
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--border);
    color: var(--text-dim);
  }

  .day-chip.on {
    background: rgba(200,169,110,0.15);
    color: var(--accent);
  }

  .alarm-label {
    font-size: 11px;
    color: var(--text-dim);
  }

  .alarm-toggle {
    position: relative;
    width: 44px;
    height: 26px;
    flex-shrink: 0;
  }

  .alarm-toggle input {
    opacity: 0;
    width: 0;
    height: 0;
    position: absolute;
  }

  .toggle-track {
    position: absolute;
    inset: 0;
    border-radius: 13px;
    background: var(--border);
    cursor: pointer;
    transition: background 0.2s;
  }

  .alarm-toggle input:checked + .toggle-track {
    background: var(--accent);
  }

  .toggle-track::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    top: 3px;
    left: 3px;
    transition: transform 0.2s;
  }

  .alarm-toggle input:checked + .toggle-track::after {
    transform: translateX(18px);
  }

  .alarm-delete {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .alarm-card:hover .alarm-delete,
  .alarm-card:active .alarm-delete { opacity: 1; }

  /* EMPTY STATE */
  .empty-alarms {
    text-align: center;
    padding: 32px 0;
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.8;
  }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    background: #16161f;
    border-radius: 24px 24px 0 0;
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 24px 24px 48px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  }

  .modal-overlay.open .modal {
    transform: translateY(0);
  }

  .modal-handle {
    width: 36px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 24px;
  }

  .modal-title {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    margin-bottom: 24px;
    color: var(--text);
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
    display: block;
  }

  .time-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Serif Display', serif;
    font-size: 48px;
    text-align: center;
    padding: 12px;
    outline: none;
    -webkit-appearance: none;
    letter-spacing: 2px;
  }

  .time-input:focus { border-color: var(--accent-dim); }

  .days-picker {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .day-btn {
    aspect-ratio: 1;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Mono', monospace;
    transition: all 0.15s;
    letter-spacing: 0;
  }

  .day-btn.selected {
    background: rgba(200,169,110,0.15);
    border-color: var(--accent-dim);
    color: var(--accent);
  }

  .label-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    padding: 12px 16px;
    outline: none;
  }

  .label-input:focus { border-color: var(--accent-dim); }
  .label-input::placeholder { color: var(--text-dim); }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
  }

  .btn {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-cancel {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }

  .btn-save {
    background: var(--accent);
    color: var(--bg);
    font-weight: 500;
  }

  .btn:active { transform: scale(0.97); }

  /* RINGING OVERLAY */
  .ringing-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,10,15,0.95);
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .ringing-overlay.show {
    opacity: 1;
    pointer-events: all;
  }

  .ringing-icon {
    font-size: 64px;
    animation: sway 0.5s ease-in-out infinite alternate;
  }

  @keyframes sway {
    from { transform: rotate(-12deg); }
    to { transform: rotate(12deg); }
  }

  .ringing-time {
    font-family: 'DM Serif Display', serif;
    font-size: 72px;
    color: var(--accent);
  }

  .ringing-label {
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .ringing-station {
    font-family: 'DM Serif Display', serif;
    font-size: 24px;
    color: var(--text);
    margin-top: 8px;
  }

  .stop-btn {
    margin-top: 32px;
    padding: 18px 48px;
    border-radius: 50px;
    border: 1.5px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }

  .stop-btn:active {
    background: var(--accent);
    color: var(--bg);
  }

  /* KEEP AWAKE NOTE */
  .keep-awake-note {
    text-align: center;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-top: auto;
    padding-top: 24px;
    line-height: 1.8;
  }

  audio { display: none; }
</style>
</head>
<body>
<div class="app">

  <!-- CLOCK -->
  <div class="clock-section">
    <div class="time-display">
      <span id="clock-h">00</span>:<span id="clock-m">00</span><span class="seconds" id="clock-s">00</span>
    </div>
    <div class="date-display" id="clock-date">—</div>
  </div>

  <!-- RADIO PLAYER -->
  <div class="player-card">
    <div class="station-label">In onda</div>
    <div class="station-name">Radio 3</div>
    <div class="station-sub">RAI Play Sound · Diretta</div>
    <div class="player-controls">
      <button class="play-btn" id="playBtn" onclick="toggleRadio()">▶</button>
      <div class="volume-section">
        <div class="volume-label">Volume</div>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.8" oninput="setVolume(this.value)">
      </div>
    </div>
    <div class="status-text">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">In attesa</span>
    </div>
  </div>

  <!-- ALARMS -->
  <div class="section-header">
    <div class="section-title">Sveglie</div>
    <button class="add-btn" onclick="openModal()">+</button>
  </div>
  <div class="alarms-list" id="alarmsList"></div>

  <p class="keep-awake-note">
    Tieni lo schermo acceso<br>per il corretto funzionamento
  </p>
</div>

<!-- ADD ALARM MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Nuova sveglia</div>

    <div class="form-group">
      <label class="form-label">Orario</label>
      <input type="time" class="time-input" id="alarmTimeInput" value="07:00">
    </div>

    <div class="form-group">
      <label class="form-label">Giorni</label>
      <div class="days-picker" id="daysPicker"></div>
    </div>

    <div class="form-group">
      <label class="form-label">Etichetta (opzionale)</label>
      <input type="text" class="label-input" id="alarmLabelInput" placeholder="es. Lavoro, Weekend...">
    </div>

    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Annulla</button>
      <button class="btn btn-save" onclick="saveAlarm()">Salva</button>
    </div>
  </div>
</div>

<!-- RINGING OVERLAY -->
<div class="ringing-overlay" id="ringingOverlay">
  <div class="ringing-icon">🔔</div>
  <div class="ringing-time" id="ringingTime">07:00</div>
  <div class="ringing-label">Sveglia</div>
  <div class="ringing-station">RAI Radio 3</div>
  <button class="stop-btn" onclick="stopAlarm()">Ferma</button>
</div>

<audio id="radioAudio" preload="none"></audio>

<script>
// ─── DAYS ────────────────────────────────────────────
const DAY_NAMES = ['Lu','Ma','Me','Gi','Ve','Sa','Do'];
const DAY_JS    = [1,2,3,4,5,6,0]; // JS: 0=Sun
let selectedDays = [];

// ─── STATE ───────────────────────────────────────────
let alarms = JSON.parse(localStorage.getItem('alarms') || '[]');
let isPlaying = false;
let isRinging = false;
let currentRingingId = null;

const audio = document.getElementById('radioAudio');
audio.src = 'https://icestreaming.rai.it/3.mp3';

// ─── CLOCK ───────────────────────────────────────────
const DAYS_IT = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
const MONTHS_IT = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];

function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock-h').textContent = h;
  document.getElementById('clock-m').textContent = m;
  document.getElementById('clock-s').textContent = s;
  document.getElementById('clock-date').textContent =
    `${DAYS_IT[now.getDay()]} ${now.getDate()} ${MONTHS_IT[now.getMonth()]}`;

  // Check alarms
  if (!isRinging) {
    alarms.forEach(a => {
      if (!a.active) return;
      const [ah, am] = a.time.split(':').map(Number);
      const dayMatch = a.days.length === 0 || a.days.includes(DAY_JS.indexOf(now.getDay()));
      if (now.getHours() === ah && now.getMinutes() === am && now.getSeconds() === 0 && dayMatch) {
        triggerAlarm(a);
      }
    });
  }
}

setInterval(updateClock, 1000);
updateClock();

// ─── RADIO ───────────────────────────────────────────
function toggleRadio() {
  if (isPlaying) stopRadio();
  else startRadio();
}

function startRadio() {
  const btn = document.getElementById('playBtn');
  btn.classList.add('loading');
  btn.textContent = '';
  setStatus('Connessione...', false);

  audio.load();
  audio.play().then(() => {
    isPlaying = true;
    btn.classList.remove('loading');
    btn.classList.add('playing');
    btn.innerHTML = '⏸';
    setStatus('In onda · Radio 3', true);
  }).catch(e => {
    btn.classList.remove('loading');
    btn.textContent = '▶';
    setStatus('Errore — riprova', false);
    // Fallback: open in browser
    window.open('https://www.raiplaysound.it/radio3', '_blank');
  });
}

function stopRadio() {
  audio.pause();
  isPlaying = false;
  const btn = document.getElementById('playBtn');
  btn.classList.remove('playing', 'loading');
  btn.innerHTML = '▶';
  setStatus('In attesa', false);
}

function setVolume(v) {
  audio.volume = parseFloat(v);
}

function setStatus(text, on) {
  document.getElementById('statusText').textContent = text;
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot' + (on ? ' on' : '');
}

audio.addEventListener('error', () => {
  setStatus('Stream non disponibile', false);
  isPlaying = false;
  const btn = document.getElementById('playBtn');
  btn.classList.remove('playing','loading');
  btn.innerHTML = '▶';
});

// ─── ALARMS ──────────────────────────────────────────
function saveAlarmsLocal() {
  localStorage.setItem('alarms', JSON.stringify(alarms));
}

function renderAlarms() {
  const list = document.getElementById('alarmsList');
  if (alarms.length === 0) {
    list.innerHTML = '<div class="empty-alarms">Nessuna sveglia impostata.<br>Tocca + per aggiungerne una.</div>';
    return;
  }
  list.innerHTML = alarms.map((a, i) => `
    <div class="alarm-card ${a.active ? 'active' : ''}" id="alarm-${a.id}">
      <div class="alarm-time-big">${a.time}</div>
      <div class="alarm-info">
        <div class="alarm-days">
          ${a.days.length === 0
            ? '<span class="day-chip on">Una volta</span>'
            : DAY_NAMES.map((d,di) => `<span class="day-chip ${a.days.includes(di) ? 'on' : ''}">${d}</span>`).join('')
          }
        </div>
        <div class="alarm-label">${a.label || 'Radio 3'}</div>
      </div>
      <label class="alarm-toggle">
        <input type="checkbox" ${a.active ? 'checked' : ''} onchange="toggleAlarm('${a.id}', this.checked)">
        <span class="toggle-track"></span>
      </label>
      <button class="alarm-delete" onclick="deleteAlarm('${a.id}')">×</button>
    </div>
  `).join('');
}

function toggleAlarm(id, active) {
  const a = alarms.find(x => x.id === id);
  if (a) { a.active = active; saveAlarmsLocal(); renderAlarms(); }
}

function deleteAlarm(id) {
  alarms = alarms.filter(x => x.id !== id);
  saveAlarmsLocal();
  renderAlarms();
}

// ─── MODAL ───────────────────────────────────────────
function buildDaysPicker() {
  const container = document.getElementById('daysPicker');
  container.innerHTML = DAY_NAMES.map((d,i) => `
    <button class="day-btn" data-i="${i}" onclick="toggleDay(${i}, this)">${d}</button>
  `).join('');
}

function toggleDay(i, btn) {
  const idx = selectedDays.indexOf(i);
  if (idx >= 0) { selectedDays.splice(idx,1); btn.classList.remove('selected'); }
  else { selectedDays.push(i); btn.classList.add('selected'); }
}

function openModal() {
  selectedDays = [];
  document.getElementById('alarmTimeInput').value = '07:00';
  document.getElementById('alarmLabelInput').value = '';
  buildDaysPicker();
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

function saveAlarm() {
  const time = document.getElementById('alarmTimeInput').value;
  const label = document.getElementById('alarmLabelInput').value.trim();
  if (!time) return;
  alarms.push({
    id: Date.now().toString(),
    time,
    days: [...selectedDays],
    label,
    active: true
  });
  saveAlarmsLocal();
  renderAlarms();
  closeModal();
}

// ─── RINGING ─────────────────────────────────────────
function triggerAlarm(alarm) {
  isRinging = true;
  currentRingingId = alarm.id;
  document.getElementById('ringingTime').textContent = alarm.time;
  document.getElementById('ringingOverlay').classList.add('show');

  // Auto-set volume to 80% for alarm
  audio.volume = 0.8;
  document.getElementById('volumeSlider').value = 0.8;
  startRadio();

  // If one-time alarm, deactivate after ringing
  if (alarm.days.length === 0) {
    alarm.active = false;
    saveAlarmsLocal();
  }
}

function stopAlarm() {
  isRinging = false;
  currentRingingId = null;
  document.getElementById('ringingOverlay').classList.remove('show');
  stopRadio();
  renderAlarms();
}

// ─── INIT ─────────────────────────────────────────────
audio.volume = 0.8;
renderAlarms();
buildDaysPicker();

// Wake lock (keep screen on)
async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try {
      await navigator.wakeLock.request('screen');
    } catch(e) {}
  }
}
requestWakeLock();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});
</script>
